# electron-builder configuration for the nightglass desktop shell.
#
# Ships the same product as three native installers. The shell loads the deployed
# nightglass origin, so the bundle stays small and the observability engine cannot
# drift between the desktop and browser builds.
#
# Windows, macOS and Linux artifacts are produced by .github/workflows/desktop.yml
# on their own runners: a macOS .dmg cannot be cross-built from Linux, so each
# platform builds its own.

appId: dev.aniruddhaadak80.nightglass
productName: nightglass
copyright: Copyright (c) 2026 aniruddhaadak80

directories:
  output: release
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  - package.json

# Only the Electron runtime is bundled. The UI is served from the deployed
# origin, so no web build output and no web dependency tree ships here.
asar: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: nightglass-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: nightglass

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: nightglass-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  category: Science
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  artifactName: nightglass-${version}-linux-${arch}.${ext}
  maintainer: aniruddhaadak80

publish: null